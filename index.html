<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REX</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="rex.riv" as="fetch" crossorigin />
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="rive-canvas"></canvas>

    <div id="collection-modal" class="modal-overlay" hidden>
      <div class="modal">
        <p class="modal-header">Vault Collection</p>
        <div id="modal-cards-list"></div>
        <button id="modal-restart-btn">Restart</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <input type="file" id="pack-file-input"   accept="image/*" hidden />
  <input type="file" id="sprite-file-input" accept="image/*" hidden />
  <input type="file" id="card-file-input"   accept="image/*" hidden />

  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.20"></script>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <script src="main.js"></script>
</body>
</html>
