<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REX</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="rex_test.riv" as="fetch" crossorigin />
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="rive-canvas"></canvas>

    <div id="collection-modal" class="modal-overlay" hidden>
      <div class="modal">
        <p class="modal-header">Vault Collection</p>
        <div id="modal-cards-list"></div>
        <button id="modal-restart-btn">Restart</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <input type="file" id="pack-file-input"   accept="image/*" hidden />
  <input type="file" id="sprite-file-input" accept="image/*" hidden />
  <input type="file" id="card-file-input"   accept="image/*" hidden />

  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.20"></script>
  <script>
    // Runtime choice requires a different JS/WASM bundle entirely, so it's
    // selected before any other script loads, persisted in localStorage by
    // the harness "Runtime" dropdown (reloads the page on change).
    (function () {
      var params  = new URLSearchParams(window.location.search);
      var runtime = params.get("runtime") || localStorage.getItem("riveRuntime") || "webgl2";
      if (runtime !== "webgl2" && runtime !== "canvas") runtime = "webgl2";
      document.write('<script src="https://unpkg.com/@rive-app/' + runtime + '@latest"><\/script>');
    })();
  </script>
  <script src="main.js"></script>
</body>
</html>
